name: Repository health

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify engineering controls
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/SYSTEM_BOUNDARY.md
          test -f docs/CONNECTOR_BOUNDARY.md
          grep -q "five-minute replay window" docs/CONNECTOR_BOUNDARY.md
          grep -q "deterministic code" docs/CONNECTOR_BOUNDARY.md
          if grep -RInE '(api[_-]?key|secret|password)[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]' . --exclude-dir=.git --exclude='*.md' --exclude='*.yml'; then
            echo 'Potential committed credential detected.'
            exit 1
          fi
          echo 'Repository controls passed.'